name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --production=false

      - name: Build project
        run: npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist
            package.json
            server.js
            web.config

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'lts-employeeportal'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '.'
      
      - name: Configure App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: 'lts-employeeportal'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          app-settings-json: |
            [
              {
                "name": "COSMOS_DB_ENDPOINT",
                "value": "${{ secrets.COSMOS_DB_ENDPOINT }}"
              },
              {
                "name": "COSMOS_DB_KEY",
                "value": "${{ secrets.COSMOS_DB_KEY }}"
              },
              {
                "name": "COSMOS_DB_DATABASE_ID",
                "value": "${{ secrets.COSMOS_DB_DATABASE_ID }}"
              },
              {
                "name": "COSMOS_DB_CONTAINER_ID",
                "value": "${{ secrets.COSMOS_DB_CONTAINER_ID }}"
              },
              {
                "name": "NODE_ENV",
                "value": "production"
              }
            ]
